<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Resonance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1938'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%238ef0ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%238ef0ff'/%3E%3C/svg%3E">
<style>
:root{--bg:#0d0b1a;--tile:#1d1938;--glow:#8ef0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 30%,#1c1640,var(--bg) 70%);color:#e9e6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;overflow:hidden}
header{margin-top:22px;text-align:center;position:relative;z-index:10}
h1{margin:0;font-weight:300;letter-spacing:.4em;font-size:22px}
#lvl{opacity:.6;font-size:13px;letter-spacing:.2em;margin-top:6px}
#hint{min-height:22px;margin:14px 0 18px;opacity:.85;font-size:15px;text-align:center;padding:0 16px}
#board{display:grid;gap:10px;position:relative;overflow:hidden;padding:12px;border-radius:22px;contain:paint;clip-path:inset(0 round 22px);background:#ffffff06;box-shadow:inset 0 0 0 1px #ffffff14}
.cell{width:var(--s);height:var(--s);border-radius:16px;position:relative}
.tile{background:var(--tile);box-shadow:inset 0 0 0 1px #ffffff14;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .3s}
.tile:hover{transform:scale(1.03)}
.tile:active{transform:scale(.94)}
.tile svg{position:relative;z-index:1;width:46%;height:46%;transition:transform .2s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 0 4px #fff3)}
.tile.rung{background:hsl(var(--h),80%,60%);animation:ring .45s ease-out;box-shadow:inset 0 0 18px 4px #fff9,0 0 0 2px #fff}
.tile.rung.past{background:hsl(var(--h),35%,34%);box-shadow:inset 0 0 0 2px hsl(var(--h),60%,55%);animation:none}
.tile.rung.past svg{stroke:#ffffffaa}
.beatno{position:absolute;top:3px;left:3px;z-index:4;font:800 15px/20px system-ui;min-width:22px;padding:0 6px;text-align:center;border-radius:8px;background:#000c;color:#fff;opacity:1;pointer-events:none}
.past .beatno{opacity:.9}
.tile.rung svg{stroke:#fff}
.tile.silent{animation:silent .4s ease-in-out 3 alternate;box-shadow:inset 0 0 0 4px #ff3b5c,0 0 0 2px #fff!important}
@keyframes silent{from{box-shadow:inset 0 0 0 4px #ff3b5c,0 0 0 2px #fff}to{box-shadow:inset 0 0 0 4px #fff,0 0 0 2px #ff3b5c}}
#msg{min-height:22px;margin:-10px 0 8px;font-size:15px;font-weight:800;letter-spacing:.03em;color:#ffb199;text-shadow:0 0 8px #ff6a4d88,0 1px 2px #000;opacity:0;transition:opacity .2s}#msg.show{opacity:1}
.tile.muted-hit{animation:shake .3s}
.tile.mute{background:repeating-linear-gradient(45deg,#05040c 0 9px,#3a3560 9px 18px);box-shadow:inset 0 0 0 4px #e9e6ff,0 0 0 2px #000}
.tile.mute svg{background:#05040ccc;border-radius:50%;padding:3px}
.tile.delay{background:radial-gradient(circle,transparent 38%,#ffb02e 39% 46%,transparent 47% 58%,#ffb02e88 59% 63%,transparent 64%),linear-gradient(#5a3a08,#3d2705);box-shadow:inset 0 0 0 3px #ffb02e}
.tile.delay .hg{position:absolute;inset:8%;width:84%;height:84%;opacity:.55;pointer-events:none;stroke:#2a1800;stroke-width:.6}
.tile.delay.rung .hg{opacity:.6;fill:#5a3a08}
.tile.delay .dl{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);z-index:4;font:700 10px/14px system-ui;white-space:nowrap;padding:0 5px;border-radius:7px;background:#000c;color:#ffc04d}
.tile.delay .beatno{left:50%;transform:translateX(-50%);top:3px;padding:0 8px;letter-spacing:.04em;white-space:nowrap}
.tile.rotable{background:conic-gradient(from 0deg,#2b2350,#4a3d12,#2b2350,#4a3d12,#2b2350);box-shadow:inset 0 0 0 3px #f7c948}
.tile.mute.rung.past,.tile.delay.rung.past{filter:saturate(.6)}
.tile.mute.rung,.tile.delay.rung,.tile.rotable.rung{background:hsl(var(--h),80%,60%)}
.tile.silent{animation:silent .4s ease-in-out 3 alternate;box-shadow:inset 0 0 0 4px #ff3b5c,0 0 0 2px #fff!important}
@keyframes silent{from{box-shadow:inset 0 0 0 4px #ff3b5c,0 0 0 2px #fff}to{box-shadow:inset 0 0 0 4px #fff,0 0 0 2px #ff3b5c}}
#msg{min-height:22px;margin:-10px 0 8px;font-size:15px;font-weight:800;letter-spacing:.03em;color:#ffb199;text-shadow:0 0 8px #ff6a4d88,0 1px 2px #000;opacity:0;transition:opacity .2s}#msg.show{opacity:1}
.tile.muted-hit{box-shadow:inset 0 0 0 4px #ff5a7a,0 0 0 2px #000}
.tile.ghost{box-shadow:inset 0 0 0 2px #8ef0ff88}
.badge{position:absolute;font-size:12px;bottom:4px;right:6px;font-weight:700}
.rot{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#f7c948;color:#222;font-size:16px;line-height:24px;text-align:center;cursor:pointer;box-shadow:0 2px 8px #0008;z-index:3}
.rot:active{transform:scale(.85)}
.wave{position:absolute;border-radius:50%;pointer-events:none;border:3px solid hsl(var(--h),90%,70%);animation:wave .9s ease-out forwards;z-index:2}
@keyframes ring{0%{transform:scale(1)}35%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes wave{from{width:0;height:0;opacity:.9;margin:0}to{width:160px;height:160px;margin:-80px;opacity:0}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#bar{margin-top:26px;display:flex;gap:12px}
button{background:#ffffff12;color:#e9e6ff;border:1px solid #ffffff22;border-radius:999px;padding:10px 18px;font-size:14px;cursor:pointer}
button:hover{background:#ffffff22}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0d0b1aee;backdrop-filter:blur(6px);z-index:9}
#win h2{font-weight:300;letter-spacing:.3em;font-size:30px;margin:0 0 20px}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,#8ef0ff55,transparent 60%);opacity:0;transition:opacity .8s}
#dots{display:flex;gap:6px;margin-top:8px;justify-content:center}
#dots i{width:8px;height:8px;border-radius:50%;background:#ffffff22;cursor:pointer}
#dots i.done{background:#8ef0ff}#dots i.cur{outline:2px solid #fff}
#tune{display:flex;align-items:center;gap:12px;margin:0 0 14px}
#strip{display:flex;gap:4px;height:112px;padding:4px 6px;border-radius:12px;background:#ffffff08;box-shadow:inset 0 0 0 1px #ffffff14}
#strip .col{position:relative;width:26px;border-radius:6px;transition:background .15s}
#strip .col .bn{position:absolute;top:1px;left:0;right:0;text-align:center;font-size:9px;opacity:.5}
#strip .col i{position:absolute;left:3px;width:20px;height:11px;border-radius:6px;background:hsl(var(--h),75%,60%);font:700 9px/11px system-ui;font-style:normal;text-align:center;color:#111}
#strip .col.hl{background:#ffffff22}
.slot{background:#ffffff05;box-shadow:inset 0 0 0 1px #ffffff0d;border-radius:12px}
.tile{border-bottom:4px solid hsl(var(--h),70%,58%)}
.pc{position:absolute;top:3px;left:4px;font:700 10px/14px system-ui;min-width:14px;text-align:center;border-radius:7px;background:hsl(var(--h),70%,58%);color:#111;z-index:3}
</style></head><body>
<header><h1>RESONANCE</h1><div id="lvl"></div><div id="dots"></div></header>
<div id="hint"></div><div id="msg" aria-live="polite" aria-hidden="true"></div>
<div id="tune"><button id="listen" title="Play the target melody (L)">♪ Listen</button><div id="strip" aria-label="Target melody"></div></div>
<div id="board"></div>
<div id="bar"><button id="undo">↶ Undo</button><button id="restart">⟲ Restart</button><button id="sound">🔊</button></div>
<div id="flash"></div>
<div id="win"><h2>RESOLVED</h2><button id="next">Next ›</button></div>
<script>
__ENGINE__
LEVELS.splice(0,LEVELS.length,...__LEVELS__);
const HUE=[0,28,52,120,175,205,255,300];           // one colour per pitch (shared by tiles and the melody strip)
const BEAT=180;
let AC=null,soundOn=true,MASTER=null,TM=[];
const later=(f,ms)=>{const t=setTimeout(f,ms);TM.push(t);return t};
function clearTimers(){TM.forEach(clearTimeout);TM=[]}
function master(a){// master gain -> limiter so dense chains never clip
 const g=a.createGain();g.gain.value=.7;const c=a.createDynamicsCompressor();c.threshold.value=-10;c.knee.value=6;c.ratio.value=12;c.attack.value=.003;c.release.value=.25;g.connect(c);c.connect(a.destination);return g}
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=master(AC)}if(AC.state==='suspended')AC.resume();return AC}
// tile note: pitch index p (0..7) -> pentatonic frequency (engine freq())
function note(p,t=0,vol=.22,dur=1.4){if(!soundOn)return;const a=ac(),o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain(),f=freq(p);
 o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2;const s=a.currentTime+t;
 g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+dur);
 const g2=a.createGain();g2.gain.value=.25;o.connect(g);o2.connect(g2);g2.connect(g);g.connect(MASTER);o.start(s);o2.start(s);o.stop(s+dur);o2.stop(s+dur)}
// wrong beat: a short harsh minor-second cluster (sawtooth a semitone above + below the played note) so the error is audible
function clash(p,t=0){if(!soundOn)return;const a=ac(),s=a.currentTime+t,f=freq(p);
 [f*Math.pow(2,1/12),f*Math.pow(2,-1/12)].forEach(fr=>{const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=fr;
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.09,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+.35);o.connect(g);g.connect(MASTER);o.start(s);o.stop(s+.36)})}
function thud(t=0){if(!soundOn)return;const a=ac(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;o.frequency.value=90;g.gain.setValueAtTime(.15,s);g.gain.exponentialRampToValueAtTime(.001,s+.2);o.connect(g);g.connect(MASTER);o.start(s);o.stop(s+.2)}
function playMelody(m,t0=0){m.forEach((ch,i)=>ch.forEach(p=>note(p,t0+i*BEAT/1000)))}
const ARROW={'>':0,'v':90,'<':180,'^':270};
function svgFor(c){const k=kind(c);const sw='stroke="#e9e6ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"';
 if(k==='split'){const r=c.t==='S|'?90:0;return `<svg viewBox="0 0 24 24" ${sw} style="transform:rotate(${r}deg)"><path d="M2 12h20M6 8l-4 4 4 4M18 8l4 4-4 4"/></svg>`}
 const d=c.t[c.t.length-1];return `<svg viewBox="0 0 24 24" ${sw} style="transform:rotate(${ARROW[d]}deg)"><path d="M4 12h15M13 6l6 6-6 6"/></svg>`}
const KEY='res2';   // v2 levels: fresh progress key
let li=0,grid,history=[],busy=false,done=JSON.parse(localStorage[KEY+'Done']||'[]');
const B=document.getElementById('board'),S=document.getElementById('strip');
function load(i){clearTimers();li=i;localStorage[KEY+'Lvl']=i;grid=parse(LEVELS[i]);history=[];busy=false;LP&&clearTimeout(LP);LP=null;longFired=false;
 const m=document.getElementById('msg');m.classList.remove('show');m.textContent='';m.setAttribute('aria-hidden','true');
 render();strip();
 document.getElementById('lvl').textContent=`${i+1} / ${LEVELS.length} · ${LEVELS[i].name.toUpperCase()}`;
 document.getElementById('hint').textContent=LEVELS[i].hint;
 document.getElementById('dots').innerHTML=LEVELS.map((_,j)=>`<i class="${done.includes(j)?'done':''} ${j===i?'cur':''}" data-j="${j}" title="Level ${j+1}"></i>`).join('');
 document.querySelectorAll('#dots i').forEach(e=>e.onclick=()=>{document.getElementById('win').style.display='none';load(+e.dataset.j)});
 if(AC)later(listen,350)}
// melody strip: one column per beat, one dot per note (height + colour = pitch, number = pitch label on tiles)
function strip(){const m=LEVELS[li].melody;S.innerHTML=m.map((ch,i)=>`<div class="col" id="b${i}"><span class="bn">${i+1}</span>${ch.map(p=>`<i style="--h:${HUE[p]};bottom:${6+p*11.5}px">${p+1}</i>`).join('')}</div>`).join('')}
function listen(){if(busy)return;ac();playMelody(LEVELS[li].melody);document.querySelectorAll('#strip .col').forEach((c,i)=>later(()=>{c.classList.add('hl');later(()=>c.classList.remove('hl'),BEAT)},i*BEAT))}
function tileSize(){return Math.max(34,Math.min(68,Math.floor((Math.min(innerWidth,560)-24-50)/N),Math.floor((innerHeight-420)/N)-10))}
function render(){clearTimeout(LP);const s=tileSize();
 B.style.setProperty('--s',s+'px');B.style.gridTemplateColumns=`repeat(${N},${s}px)`;B.innerHTML='';
 grid.forEach((r,y)=>r.forEach((c,x)=>{const d=document.createElement('div');d.className='cell';d.id=`c${x}_${y}`;
  if(!c){d.className+=' slot';B.appendChild(d);return}
  const k=kind(c);d.className+=' tile'+(k==='split'||k==='arrow'?'':' '+(k==='rot'?'rotable':k));
  d.innerHTML=(k==='delay'?HG:'')+svgFor(c)+`<span class="pc">${c.p+1}</span>`+(k==='delay'?'<span class="dl">+1 beat</span>':'')+(k==='mute'?'<span class="badge" style="background:#05040c;padding:0 3px;border-radius:4px">×2</span>':'');
  d.style.setProperty('--h',HUE[c.p]);d.dataset.p=c.p;
  if(k==='rot'){const b=document.createElement('div');b.className='rot';b.textContent='↻';b.title='Rotate clockwise (right-click / long-press tile: counter-clockwise)';
   b.onpointerdown=e=>e.stopPropagation();b.onclick=e=>{e.stopPropagation();turn(x,y,1)};d.appendChild(b);
   d.oncontextmenu=e=>{e.preventDefault();clearTimeout(LP);if(!longFired)turn(x,y,3)};
   d.onpointerdown=e=>{longFired=false;if(e.button)return;clearTimeout(LP);LP=setTimeout(()=>{LP=null;longFired=true;turn(x,y,3)},450)};d.onpointerup=d.onpointerleave=()=>{clearTimeout(LP)}}
  else d.oncontextmenu=e=>e.preventDefault();
  d.onclick=()=>{if(longFired){longFired=false;return}play(x,y)};d.onmouseenter=()=>preview(x,y);d.onmouseleave=clearPreview;
  B.appendChild(d)}))}
let LP=null,longFired=false;
const HG='<svg class="hg" viewBox="0 0 24 24" fill="#ffb02e"><path d="M6 2h12v2c0 4-4 6-4 8s4 4 4 8v2H6v-2c0-4 4-6 4-8S6 8 6 4z"/></svg>';
// k=1 clockwise, k=3 counter-clockwise; history stores the step so undo inverts it
function turn(x,y,k){clearTimeout(LP);if(busy)return;const c=grid[y][x];for(let i=0;i<k;i++)rotate(c);history.push([x,y,k]);thud();render();preview(x,y)}
function clearPreview(){document.querySelectorAll('.ghost').forEach(e=>e.classList.remove('ghost'))}
function preview(x,y){if(busy)return;clearPreview();if(!grid[y][x])return;
 targets(grid,x,y).forEach(([a,b])=>document.getElementById(`c${a}_${b}`).classList.add('ghost'))}
function wave(el){const w=document.createElement('div');w.className='wave';w.style.left='50%';w.style.top='50%';w.style.setProperty('--h',el.style.getPropertyValue('--h'));el.appendChild(w);later(()=>w.remove(),900)}
function play(x,y){if(busy)return;busy=true;clearPreview();ac();const r=simulate(grid,x,y),ev=r.ev,tgt=LEVELS[li].melody;
 document.querySelectorAll('#strip .col').forEach(c=>c.classList.remove('hl'));
 const beats=Math.max(r.melody.length,tgt.length);
 for(let b=0;b<beats;b++){const here=ev.filter(e=>e.beat===b);
  later(()=>{const good=chordEq(r.melody[b]||[],tgt[b]||[]);   // no visual per-beat mark: only the clash sound reveals which beat is wrong
   here.forEach(e=>{const el=document.getElementById(`c${e.x}_${e.y}`),c=grid[e.y][e.x];if(e.muted){el.classList.add('muted-hit');thud();return}
    document.querySelectorAll('.rung:not(.past)').forEach(t=>{if(+t.dataset.beat<e.beat)t.classList.add('past')});el.dataset.beat=e.beat;el.classList.add('rung');
    const bn=document.createElement('span');bn.className='beatno';bn.textContent=kind(c)==='delay'?`${e.beat+1}→${e.beat+2}`:e.beat+1;el.appendChild(bn);wave(el);note(c.p);if(!good)clash(c.p)});
   if(!good&&!here.some(e=>!e.muted))clash((tgt[b]||[0])[0]);   // a missing note is wrong too
   if(navigator.vibrate)navigator.vibrate(good?12:[30,20,30])},b*BEAT)}
 const won=r.solved&&melodyEq(r.melody,tgt);
 later(()=>{if(won)win();else fail(r)},(beats-1)*BEAT+500)}
// failed chain: pulse silent tiles, "N tiles silent · melody off at beat N" for ~1.2s, then reset
function fail(r){const rung=new Set(r.ev.filter(e=>!e.muted).map(e=>e.x+','+e.y));let n=0;
 grid.forEach((row,y)=>row.forEach((c,x)=>{if(c&&!rung.has(x+','+y)){n++;document.getElementById(`c${x}_${y}`).classList.add('silent')}}));
 const T=LEVELS[li].melody,right=T.filter((c,i)=>chordEq(r.melody[i]||[],c)).length;const parts=[`${right} of ${T.length} beats right`];if(n)parts.push(`${n} tile${n===1?'':'s'} silent`);
 const m=document.getElementById('msg');m.textContent=parts.join(' · ');m.classList.add('show');m.removeAttribute('aria-hidden');
 later(()=>{m.classList.remove('show');m.textContent='';m.setAttribute('aria-hidden','true');document.querySelectorAll('.rung').forEach(e=>{e.style.transition='background 1s';e.classList.remove('rung','past')});
  later(()=>{busy=false;render()},700)},1200)}
function win(){if(soundOn)[0,2,4,5].forEach((p,i)=>note(p,i*.06,.18,2.4));
 const f=document.getElementById('flash');f.style.opacity=1;later(()=>f.style.opacity=0,500);
 document.querySelectorAll('.tile').forEach((t,i)=>later(()=>{t.animate([{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:400});wave(t)},i*40));
 if(!done.includes(li)){done.push(li);localStorage[KEY+'Done']=JSON.stringify(done)}
 later(()=>{const w=document.getElementById('win');w.style.display='flex';document.getElementById('next').textContent=li<LEVELS.length-1?'Next ›':'Play again'},1100)}
document.getElementById('next').onclick=()=>{document.getElementById('win').style.display='none';load(li<LEVELS.length-1?li+1:0)};
document.getElementById('restart').onclick=()=>load(li);   // allowed any time: cancels a running chain
document.getElementById('listen').onclick=listen;
document.getElementById('undo').onclick=()=>{if(busy||!history.length)return;const [x,y,k]=history.pop();for(let i=0;i<4-k;i++)rotate(grid[y][x]);render()};
document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊':'🔇'};
addEventListener('keydown',e=>{if(e.key==='r')document.getElementById('restart').click();if(e.key==='z')document.getElementById('undo').click();if(e.key==='l')listen()});
addEventListener('resize',()=>{if(!busy)render()});
// fresh load: first unsolved level (level 1 for new players); dots remain the level picker
const firstOpen=LEVELS.findIndex((_,j)=>!done.includes(j));load(firstOpen<0?0:firstOpen);
</script></body></html>
