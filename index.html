// Mute tiles ring only when TWO OR MORE rings arrive on the SAME beat; a lone ring is absorbed.

 for(const d of tileDirs(grid[y0][x0])){let [dx,dy]=DIRS[d],x=x0+dx,y=y0+dy;
  while(x>=0&&y>=0&&x<W&&y<H&&!grid[y][x]){x+=dx;y+=dy;}
  if(x>=0&&y>=0&&x<W&&y<H)out.push([x,y]);}return out}
// returns events [{beat,x,y,muted?}], solved (all tiles rang), melody [[pitches] per beat]

 const total=grid.flat().filter(Boolean).length;
 for(let b=0;b<=Math.max(...Object.keys(arr).map(Number));b++){const here=arr[b];if(!here)continue;

s": ["v:0 . S-:4 . . Mv:4", ". . S|:0 S-:0 S-:4 ^:3", ". ^:4 . . Rv:4 .", ". . >:0 . S|:3 .", ". ^:0 . . <:0 .", ". . . . . ."], "melody": [[0], [0, 4], [0, 3, 4], [0, 3, 4], [0, 4], [0, 4]]}, {"name": "Delay", "hint": "Hourglass tiles hold the ring one extra beat before passing it on.", "rows": [". S-:0 . D<:3 R>:5 .", "R>:5 S-:2 . . S|:2 S|:2", "Dv:3 . . . . .", ". . . . . D^:3", "S|:4 S|:5 . . S-:2 R^:2", ". R^:5 D>:4 . S-:1 ."], "melody": [[2], [2, 5], [2, 3, 5], [2, 3, 5], [0, 4, 5], [2, 3], [1], [4]]}, {"name": "Chorus", "hint": "Chorus: three dials, splits, one striped mute and one hourglass. Many settings ring every tile; the strip shows only the top note of each beat, so listen for the chords.", "rows": [". . . . . .", "R>:1 S-:5 . >:5 S|:4 .", "R<:5 . >:0 Mv:5 S-:5 R^:4", ". . . . . .", ". . . . . .", ". S|:5 . S-:5 >:1 D>:1"], "melody": [[5], [5], [1, 5], [4, 5], [0, 5], [4, 5], [1, 5], [1]]}, {"name": "Tuning", "hint": "Tuning: four dials, splits and a mute. A dozen settings ring every tile, only one sings the tune.", "rows": [". . . . . .", "S|:2 . S-:5 . . R^:4", ">:4 . . . Mv:5 S-:1", ". R^:1 . v:4 ^:3 .", ". ^:5 . . R^:5 <:0", ". . ^:5 S-:0 . Rv:2"], "melody": [[5], [1], [4], [0], [2, 5], [0, 5], [2, 4, 5], [1, 3, 4], [5]]}, {"name": "Finale", "hint": "Finale: four dials with splits, a mute and an hourglass all together. Count on your ears, not the strip.", "rows": [". . . . . .", ">:5 . M>:3 . . S-:2", ". . ^:4 Rv:1 v:3 R>:3", "^:2 S-:2 S|:4 S|:2 . .", ". Rv:5 . S-:4 >:2 Rv:5", ". . Dv:3 . . ."], "melody": [[2], [1, 4], [2, 3, 5], [2, 5], [2, 3, 4], [2, 3, 4, 5], [3]]}]);

['pointerdown','touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlock,{capture:true,passive:true}));
// sound icon reflects the real context state; banner offers an explicit unlock until the context is running
function soundUI(){const b=document.getElementById('sound'),st=AC?AC.state:'none',on=soundOn&&st==='running';if(!b)return;

 b.title=!soundOn?'Sound off (click to turn on)':st==='running'?'Sound on (click to mute)':'Sound not enabled yet: tap to enable';b.setAttribute('aria-label',b.title);
 const n=document.getElementById('unlock'),hide=st==='running'||!soundOn;   // hide after the gesture finishes, so the banner's own click still lands

function ac(){return AC}
// tile note: pitch index p (0..5) -> pentatonic frequency (engine freq())
function note(p,t=0,vol=.22,dur=1.4){if(!soundOn||!AC)return;const a=ac(),o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain(),f=freq(p);
 o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2;const s=a.currentTime+t;
 g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+dur);
 const g2=a.createGain();g2.gain.value=.25;o.connect(g);o2.connect(g2);g2.connect(g);g.connect(MASTER);o.start(s);o2.start(s);o.stop(s+dur);o2.stop(s+dur)}
// wrong beat: a short harsh minor-second cluster (sawtooth a semitone above + below the played note) so the error is audible
function clash(p,t=0){if(!soundOn||!AC)return;const a=ac(),s=a.currentTime+t,f=freq(p);

  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.09,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+.35);o.connect(g);g.connect(MASTER);o.start(s);o.stop(s+.36)})}

function playMelody(m,t0=0){m.forEach((ch,i)=>ch.forEach(p=>note(p,t0+i*BEAT/1000)))}
const ARROW={'>':0,'v':90,'<':180,'^':270};
function svgFor(c){const k=kind(c);const sw='stroke="#e9e6ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"';
 if(k==='split'){const r=c.t==='S|'?90:0;return `<svg viewBox="0 0 24 24" ${sw} style="transform:rotate(${r}deg)"><path d="M2 12h20M6 8l-4 4 4 4M18 8l4 4-4 4"/></svg>`}
 const d=c.t[c.t.length-1];return `<svg viewBox="0 0 24 24" ${sw} style="transform:rotate(${ARROW[d]}deg)"><path d="M4 12h15M13 6l6 6-6 6"/></svg>`}
const KEY='res28';   // v2.8 levels; old progress (res2*) is ignored
let li=0,grid,history=[],busy=false,done=JSON.parse(localStorage[KEY+'Done']||'[]');
const B=document.getElementById('board'),S=document.getElementById('strip'),TR=document.getElementById('track');
// strip viewport = board width; the track scrolls (transform) when beats don't fit
let trackX=0;
function trackMax(){return Math.max(0,TR.scrollWidth-S.clientWidth)}
function setTrack(x,anim=true){const m=trackMax();trackX=Math.max(0,Math.min(m,x));TR.classList.toggle('drag',!anim);TR.style.transform=`translateX(${-trackX}px)`;
 S.classList.toggle('more-l',trackX>1);S.classList.toggle('more-r',trackX<m-1)}
function follow(i){const c=document.getElementById('b'+i);if(!c||!trackMax())return;setTrack(c.offsetLeft+c.offsetWidth/2-S.clientWidth/2)}
// columns spread evenly over the full strip width when each would be >= 28px and wide enough for its chord; otherwise
// natural fixed-width columns that scroll
function fitStrip(){S.style.width=B.offsetWidth+'px';TR.classList.remove('fill');const cols=[...TR.children];const n=cols.length;
 if(n){const avail=S.clientWidth-20-4*(n-1),cw=avail/n,need=Math.max(...cols.map(c=>{const k=c.children.length;return k?k*10+3*(k-1)+4:0}));   // bars may shrink to 10px in fill mode
  if(cw>=28&&cw>=need){TR.classList.add('fill');TR.style.setProperty('--cw',cw+'px');cols.forEach(c=>c.style.setProperty('--nb',c.children.length))}}
 setTrack(0)}
// strip: drag/swipe scrolls; a clean tap (< 8px movement, < 400ms) replays the tune. Playback starts from the click
// event (after touchend) so iOS treats it as a valid audio gesture.
{let d=null,clean=false;S.addEventListener('pointerdown',e=>{d={x:e.clientX,y:e.clientY,t:trackX,at:performance.now(),moved:0};clean=false;if(trackMax())try{S.setPointerCapture(e.pointerId)}catch(_){}});
 S.addEventListener('pointermove',e=>{if(!d)return;d.moved=Math.max(d.moved,Math.hypot(e.clientX-d.x,e.clientY-d.y));if(trackMax()&&d.moved>=8)setTrack(d.t-(e.clientX-d.x),false)});
 S.addEventListener('pointerup',e=>{if(d){d.moved=Math.max(d.moved,Math.hypot(e.clientX-d.x,e.clientY-d.y));clean=d.moved<8&&performance.now()-d.at<400}d=null;TR.classList.remove('drag')});
 S.addEventListener('pointercancel',()=>{d=null;clean=false;TR.classList.remove('drag')});
 S.addEventListener('click',()=>{if(clean){clean=false;listen()}});
 S.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();listen()}})}
// hint popover: auto-shown once per device on levels that introduce a mechanic; '?' reopens; tap or first move dismisses
const HINT_AUTO=[0,1,2,3,5,6];   // basics, gaps, dial, split, mute, delay
var undoRestart=null;
const HP=document.getElementById('hintpop');
function seenHints(){try{return JSON.parse(localStorage[KEY+'Hints']||'[]')}catch(e){return[]}}
function showHint(){HP.innerHTML=`${LEVELS[li].hint}<small>Tap to close · ? to reopen</small>`;HP.hidden=false}
function hideHint(){HP.hidden=true}
function hideMsg(){const m=document.getElementById('msg');m.classList.remove('show');m.textContent='';m.setAttribute('aria-hidden','true')}
HP.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault()});HP.addEventListener('pointerup',e=>{e.stopPropagation();e.preventDefault();hideHint()});HP.addEventListener('touchend',e=>{e.stopPropagation();e.preventDefault();hideHint()},{passive:false});HP.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();hideHint()});
function load(i){clearTimers();undoRestart=null;sel=null;previewsLeft=PREVIEW_LIMIT;li=i;localStorage[KEY+'Lvl']=i;grid=parse(LEVELS[i]);history=[];busy=false;LP&&clearTimeout(LP);LP=null;longFired=false;
 const m=document.getElementById('msg');m.classList.remove('show');m.textContent='';m.setAttribute('aria-hidden','true');
 render();strip();fitStrip();playUI();
 document.getElementById('lvl').textContent=`${i+1} / ${LEVELS.length} · ${LEVELS[i].name.toUpperCase()}`;
 hideHint();if(HINT_AUTO.includes(i)&&!seenHints().includes(i)){localStorage[KEY+'Hints']=JSON.stringify([...seenHints(),i]);showHint()}
 document.getElementById('dots').innerHTML=LEVELS.map((L,j)=>`<button type="button" class="dot${done.includes(j)?' done':''}" data-j="${j}" aria-label="Level ${j+1}: ${L.name}${done.includes(j)?' (solved)':''}" title="Level ${j+1}: ${L.name}"${j===i?' aria-current="step"':''}></button>`).join('');
 document.querySelectorAll('#dots .dot').forEach(e=>e.onclick=()=>{document.getElementById('win').style.display='none';load(+e.dataset.j)});
 if(audioReady())later(listen,350);else soundUI()}   // auto-play the tune only once sound is unlocked; never creates the context
// melody strip: one column per beat, one bar per note (bar height + colour = pitch; chord notes side by side). No digits.
// one bar per beat = the top note of that beat's chord (the strip never shows how many notes sound on a beat; Listen still plays full chords)
function strip(){const m=LEVELS[li].melody;TR.innerHTML=m.map((ch,i)=>`<div class="col" id="b${i}">${ch.length?`<i style="height:${PH(Math.max(...ch))}%"></i>`:''}</div>`).join('')}
let LT=[];   // Listen highlight timers: cancelled (and the highlight cleared) when a chain starts or the level reloads
function listen(){if(busy)return;unlock();LT.forEach(clearTimeout);LT=[];clearStrip();playMelody(LEVELS[li].melody);const cols=[...document.querySelectorAll('#strip .col')];
 cols.forEach((c,i)=>LT.push(later(()=>{clearStrip();c.classList.add('hl');follow(i)},i*BEAT)));LT.push(later(clearStrip,cols.length*BEAT));LT.push(later(()=>setTrack(0),cols.length*BEAT+400))}
// board as large as the viewport allows: width minus board padding/gaps/margin, height minus header, strip and controls
function gapPx(){return innerWidth<520?6:10}
function tileSize(){const g=gapPx()*(N-1)+24,used=document.querySelector('header').offsetHeight+document.getElementById('msg').offsetHeight+document.getElementById('tune').offsetHeight+document.getElementById('bar').offsetHeight+10+8+10+14+16+52;   // +52: room for the bottom "Tap to enable sound" banner
 return Math.max(34,Math.min(120,Math.floor((Math.min(innerWidth,1000)-g-12)/N),Math.floor((innerHeight-used-g)/N)))}
function render(){clearTimeout(LP);const s=tileSize();
 B.style.setProperty('--s',s+'px');B.style.setProperty('--gap',gapPx()+'px');B.style.gridTemplateColumns=`repeat(${N},${s}px)`;B.innerHTML='';
 grid.forEach((r,y)=>r.forEach((c,x)=>{const d=document.createElement('div');d.className='cell';d.id=`c${x}_${y}`;
  if(!c){d.className+=' slot';B.appendChild(d);return}
  const k=kind(c);d.className+=' tile'+(k==='split'||k==='arrow'?'':' '+(k==='rot'?'rotable':k));
  d.innerHTML=(k==='delay'?HG:'')+svgFor(c)+(k==='delay'?'<span class="dl">+1 beat</span>':'')+(k==='mute'?'<span class="badge" style="background:#05040c;padding:0 3px;border-radius:4px">×2</span>':'');

  if(k==='rot'){const b=document.createElement('div');b.className='rot';b.textContent='↻';b.title='Rotate clockwise (right-click / long-press tile: counter-clockwise)';
   b.onpointerdown=e=>e.stopPropagation();b.onclick=e=>{e.stopPropagation();turn(x,y,1)};d.appendChild(b);
   d.oncontextmenu=e=>{e.preventDefault();clearTimeout(LP);if(!longFired)turn(x,y,3)};
   d.onpointerdown=e=>{longFired=false;if(e.button)return;clearTimeout(LP);LP=setTimeout(()=>{LP=null;longFired=true;turn(x,y,3)},450)};d.onpointerup=d.onpointerleave=()=>{clearTimeout(LP)}}
  else d.oncontextmenu=e=>e.preventDefault();
  // tap: dials rotate; any other tile is selected and previews its own note (no chain, no bar, not an attempt)
  d.onclick=()=>{if(longFired){longFired=false;return}if(k==='rot'){turn(x,y,1);return}pick(x,y)};
  d.onmouseenter=()=>preview(x,y);d.onmouseleave=clearPreview;
  if(sel&&sel.x===x&&sel.y===y)d.classList.add('sel');
  B.appendChild(d)}))}
let LP=null,longFired=false;
// ---- selection + preview, ▶ Play runs the chain from the selected tile ----
let PREVIEW_LIMIT=new URLSearchParams(location.search).get('preview');PREVIEW_LIMIT=PREVIEW_LIMIT?+PREVIEW_LIMIT:null;   // null = unlimited previews
let sel=null,previewsLeft=null,attempts=0,previews=0;
function selectable(x,y){const c=grid[y]&&grid[y][x];return !!c&&kind(c)!=='rot'}
function setSel(x,y){document.querySelectorAll('.tile.sel').forEach(e=>e.classList.remove('sel'));sel=x==null?null:{x,y};
 if(sel){const el=document.getElementById(`c${x}_${y}`);if(el)el.classList.add('sel')}playUI()}
function pick(x,y){if(busy||!selectable(x,y))return;hideHint();setSel(x,y);
 if(PREVIEW_LIMIT!=null){if(previewsLeft<=0){thud();playUI();return}previewsLeft--}
 previews++;note(grid[y][x].p);const el=document.getElementById(`c${x}_${y}`);if(el){el.classList.remove('pv');void el.offsetWidth;el.classList.add('pv')}
 // enable ▶ Play synchronously so a click queued right after this select always lands (Play used to stay disabled for a frame)
 const b=document.getElementById('play');if(b){b.disabled=false;b.textContent='▶ Play';b.title='Ring the chain from the selected tile (P / Enter)'}}
function playUI(){const b=document.getElementById('play');if(!b)return;b.disabled=!sel||busy;b.textContent=busy?'Playing…':'▶ Play';b.title=busy?'Playing…':sel?'Ring the chain from the selected tile (P / Enter)':'Select a tile first: tap it to hear its note';b.style.cursor=busy?'wait':'';
 const c=document.getElementById('pvc');if(c){c.hidden=PREVIEW_LIMIT==null;c.textContent=PREVIEW_LIMIT==null?'':`👂 ${previewsLeft}`;c.title=`${previewsLeft} preview${previewsLeft===1?'':'s'} left this attempt`}}
function playSel(){if(!sel||busy)return;attempts++;previewsLeft=PREVIEW_LIMIT;play(sel.x,sel.y)}
function moveSel(dx,dy){if(busy)return;const T=[];grid.forEach((r,y)=>r.forEach((c,x)=>{if(selectable(x,y))T.push([x,y])}));if(!T.length)return;

 if(best)pick(best[0],best[1])}
const PH=p=>Math.round(14+p*(62/(SCALE.length-1)));   // bar height % for pitch p (strip and tiles share the scale)
const pbar=p=>`<span class="pb" style="height:${(PH(p)*.8).toFixed(1)}%"></span>`;
function reveal(el,x,y,p){el.querySelectorAll('.pb').forEach(e=>e.remove());el.insertAdjacentHTML('beforeend',pbar(p))}

// update one tile's arrow in place (no board rebuild, so a click that lands mid-update is never lost)
function refreshTile(x,y){const el=document.getElementById(`c${x}_${y}`),o=el&&el.querySelector('svg:not(.hg)');if(o)o.outerHTML=svgFor(grid[y][x])}
function clearStrip(){document.querySelectorAll('#strip .col.hl').forEach(c=>c.classList.remove('hl'))}
const HG='<svg class="hg" viewBox="0 0 24 24" fill="#ffb02e"><path d="M6 2h12v2c0 4-4 6-4 8s4 4 4 8v2H6v-2c0-4 4-6 4-8S6 8 6 4z"/></svg>';
// k=1 clockwise, k=3 counter-clockwise; history stores the step so undo inverts it
function turn(x,y,k){clearTimeout(LP);if(busy)return;undoRestart=null;hideHint();const c=grid[y][x];for(let i=0;i<k;i++)rotate(c);history.push([x,y,k]);thud();hideBars();refreshTile(x,y);preview(x,y)}
function clearPreview(){document.querySelectorAll('.ghost').forEach(e=>e.classList.remove('ghost'))}
function preview(x,y){if(busy||li>=4)return;clearPreview();   // dial-target outline is a teaching aid: levels 1-4 only

function wave(el){const w=document.createElement('div');w.className='wave';w.style.left='50%';w.style.top='50%';el.appendChild(w);later(()=>w.remove(),900)}

 LT.forEach(clearTimeout);LT=[];clearStrip();hideBars();hideMsg();
 const beats=Math.max(r.melody.length,tgt.length);
 for(let b=0;b<beats;b++){const here=ev.filter(e=>e.beat===b);
  later(()=>{follow(b);const good=chordEq(r.melody[b]||[],tgt[b]||[]);   // no visual per-beat mark: only the clash sound reveals which beat is wrong
   here.forEach(e=>{const el=document.getElementById(`c${e.x}_${e.y}`),c=grid[e.y][e.x];if(e.muted){el.classList.add('muted-hit');thud();return}
    document.querySelectorAll('.rung:not(.past)').forEach(t=>{if(+t.dataset.beat<e.beat){t.classList.add('past')}});el.dataset.beat=e.beat;el.classList.add('rung');reveal(el,e.x,e.y,c.p);
    const bn=document.createElement('span');bn.className='beatno';bn.textContent=kind(c)==='delay'?`${e.beat+1}→${e.beat+2}`:e.beat+1;el.appendChild(bn);wave(el);note(c.p);if(!good)clash(c.p)});
   if(!good&&!here.some(e=>!e.muted))clash((tgt[b]||[0])[0]);   // a missing note is wrong too
   if(navigator.vibrate)navigator.vibrate(good?12:[30,20,30])},b*BEAT)}

 later(()=>{if(won)win();else fail(r)},(beats-1)*BEAT+500)}
// failed chain: pulse silent tiles, "N tiles silent · melody off at beat N" for ~1.2s, then reset
function fail(r){const rung=new Set(r.ev.filter(e=>!e.muted).map(e=>e.x+','+e.y));let n=0;
 grid.forEach((row,y)=>row.forEach((c,x)=>{if(c&&!rung.has(x+','+y)){n++;document.getElementById(`c${x}_${y}`).classList.add('silent')}}));
 const T=LEVELS[li].melody,right=T.filter((c,i)=>chordEq(r.melody[i]||[],c)).length;const parts=[`${right} of ${T.length} beats right`];if(n)parts.push(`${n} tile${n===1?'':'s'} silent`);
 const m=document.getElementById('msg');m.textContent=parts.join(' · ');m.classList.add('show');m.removeAttribute('aria-hidden');
 later(()=>{document.querySelectorAll('.rung').forEach(e=>{e.style.transition='background 1s';e.classList.remove('rung','past')});
  later(()=>{busy=false;resetTiles();playUI()},700)},1200)}
// back to the idle look in place (pitch bars of this attempt stay until the next attempt / Restart / rotate)
function resetTiles(){setTrack(0);document.querySelectorAll('.tile').forEach(e=>{e.classList.remove('rung','past','silent','muted-hit');e.style.transition='';})}

 document.querySelectorAll('.tile').forEach((t,i)=>later(()=>{t.animate([{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:400});wave(t)},i*40));
 if(!done.includes(li)){done.push(li);localStorage[KEY+'Done']=JSON.stringify(done)}
 later(()=>{const w=document.getElementById('win');w.style.display='flex';document.getElementById('next').textContent=li<LEVELS.length-1?'Next ›':'Play again';busy=false;resetTiles();playUI()},1100)}
document.getElementById('next').onclick=()=>{document.getElementById('win').style.display='none';load(li<LEVELS.length-1?li+1:0)};
undoRestart=null;   // snapshot so ↶ Undo can reverse a Restart (dials, history, selection, last Play's bars + message)
document.getElementById('restart').onclick=()=>{const m=document.getElementById('msg');
 const snap={li,rows:grid.map(r=>r.map(c=>c&&c.t)),history:history.slice(),sel:sel&&{...sel},msg:m.textContent,
  marks:[...document.querySelectorAll('.tile')].map(e=>[e.id,[...e.querySelectorAll('.pb,.beatno')].map(n=>n.outerHTML).join('')]).filter(a=>a[1])};
 load(li);if(snap.history.length||snap.marks.length||snap.msg||snap.sel)undoRestart=snap};   // allowed any time: cancels a running chain
document.getElementById('play').onclick=playSel;document.getElementById('play').onpointerdown=e=>{if(!busy&&sel){e.preventDefault();playSel()}};
document.getElementById('help').onclick=()=>HP.hidden?showHint():hideHint();
document.getElementById('undo').onclick=()=>{if(busy)return;
 if(undoRestart&&!history.length&&undoRestart.li===li){const s=undoRestart;undoRestart=null;
  grid.forEach((r,y)=>r.forEach((c,x)=>{if(c&&s.rows[y][x])c.t=s.rows[y][x]}));history=s.history;render();if(s.sel)setSel(s.sel.x,s.sel.y);
  s.marks.forEach(([id,h])=>{const e=document.getElementById(id);if(e)e.insertAdjacentHTML('beforeend',h)});
  if(s.msg){const m=document.getElementById('msg');m.textContent=s.msg;m.classList.add('show');m.removeAttribute('aria-hidden')}return}
 if(!history.length)return;const [x,y,k]=history.pop();for(let i=0;i<4-k;i++)rotate(grid[y][x]);hideBars();refreshTile(x,y)};
document.getElementById('sound').onclick=()=>{if(soundOn&&!audioReady()){unlock();return}soundOn=!soundOn;soundUI()};
document.getElementById('unlock').onclick=()=>{unlock();soundOn=true;soundUI();setTimeout(()=>{if(!busy)listen()},60)};
addEventListener('keydown',e=>{const tg=e.target;const onCtl=tg&&tg.closest&&tg.closest('button,#strip,[role=button]');
 if(e.key.startsWith('Arrow')){const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!onCtl||tg===B){e.preventDefault();moveSel(...m)}}
 if(e.key==='p'||e.key==='P'||(e.key==='Enter'&&!onCtl))playSel();
 if(e.key==='r')document.getElementById('restart').click();if(e.key==='z')document.getElementById('undo').click();if(e.key==='l')listen()});
addEventListener('resize',()=>{if(!busy)render();fitStrip()});
// fresh load: first unsolved level (level 1 for new players); dots remain the level picker
const firstOpen=LEVELS.findIndex((_,j)=>!done.includes(j));load(firstOpen<0?0:firstOpen);
